name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trackbridge
          POSTGRES_PASSWORD: trackbridge
          POSTGRES_DB: trackbridge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trackbridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://trackbridge:trackbridge@localhost:5432/trackbridge_test
      - run: npm test --workspace=backend --workspace=frontend --workspace=shared --if-present
        env:
          DATABASE_URL: postgresql://trackbridge:trackbridge@localhost:5432/trackbridge_test
          JWT_ACCESS_SECRET: ci-access
          JWT_REFRESH_SECRET: ci-refresh
      - run: pip install -r ai-service/requirements.txt && pytest ai-service/tests
      - run: npm run build
